name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./... && (cd det && go build ./...) && (cd gltf && go build ./...)
      - name: Vet
        run: go vet ./... && (cd det && go vet ./...) && (cd gltf && go vet ./...)
      - name: Test
        run: go test ./... && (cd det && go test ./...) && (cd gltf && go test ./...)
